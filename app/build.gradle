apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.mutabii.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mutabii.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // مفتاح توقيع ثابت — يضمن أن كل تحديث يُثبَّت فوق القديم بلا حذف (نفس التوقيع دائماً)
        stable {
            storeFile file('mutabii-stable.keystore')
            storePassword 'mutabii123'
            keyAlias 'mutabii'
            keyPassword 'mutabii123'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.stable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // لا اعتماديات خارجية — التطبيق يستخدم واجهات أندرويد الأصلية فقط
}
