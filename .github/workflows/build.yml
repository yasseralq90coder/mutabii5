name: بناء تطبيق مُتابِعي APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الملفات
        uses: actions/checkout@v4

      - name: تجهيز Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم SDK المطلوبة
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null || true

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء الـAPK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: تجهيز المُخرَج
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Mutabii.apk

      - name: رفع الـAPK كمُخرَج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Mutabii-APK
          path: out/Mutabii.apk

      - name: إنشاء إصدار (Release) مع الـAPK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: مُتابِعي APK v2.0.${{ github.run_number }}
          files: out/Mutabii.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
